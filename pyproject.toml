[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yuzu-companion"
version = "4.2.0"
description = "AI companion system with memory, multimodal, and multi-provider support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "icedeyes12", email = "banibaskara@gmail.com"}
]
dependencies = [
    "psycopg[binary,pool]>=3.1",
    "pycryptodome>=3.20.0",
    "python-dotenv>=1.0.0",
    "fsrs>=6.3.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "Jinja2>=3.1.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "requests>=2.33.0",
    "httpx>=0.27.0",
    "httpx2>=2.0.0",
]

[project.scripts]
yuzu = "cli.app:main"
yuzu-server = "main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "cli*", "scripts*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "unit: isolated tests with fakes or mocks",
    "contract: public API, schema, and serialization contracts",
    "integration: tests using multiple real application components",
    "db: tests requiring a real PostgreSQL database",
    "e2e: end-to-end tests across process boundaries",
    "slow: tests that are intentionally slower or network-dependent",
    "regression: tests preserving a previously fixed behavior",
]

[tool.mutmut]
source_paths = ["app/api", "app/core", "app/services", "app/tools"]
test_command = "pytest -q -m 'unit or contract'"
