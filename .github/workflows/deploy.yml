name: Deploy Backend to Appliance

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Termux Appliance
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TERMUX_HOST }}
          username: ${{ secrets.TERMUX_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 8022
          script: |
            set -e
            echo "==> Deploying yuzu-core on appliance via PRoot Debian..."
            
            proot-distro login debian -- bash -c '
              set -e
              cd /root/home/workspace/yuzu-core
              git fetch origin master
              git reset --hard origin/master
              
              export UV_LINK_MODE=copy
              if command -v uv >/dev/null 2>&1; then
                uv pip install -r requirements.txt --quiet || .venv/bin/pip install -r requirements.txt --quiet
              else
                .venv/bin/pip install -r requirements.txt --quiet
              fi
              
              echo "==> Restarting FastAPI service..."
              pkill -f "uvicorn main:app" 2>/dev/null || true
              sleep 1
              nohup .venv/bin/python3 -m uvicorn main:app --host 127.0.0.1 --port 5000 --workers 1 > /var/log/fastapi.log 2>&1 &
              
              echo "==> Validating health endpoint..."
              sleep 4
              for i in $(seq 1 10); do
                if curl -s -f http://127.0.0.1:5000/health >/dev/null; then
                  echo "[OK] Deployment succeeded! Health check passed."
                  exit 0
                fi
                sleep 1
              done
              
              echo "[ERROR] Health check failed after deployment!"
              exit 1
            '
