name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff pytest pytest-asyncio

      - name: Check Python formatting
        run: |
          echo "::group::Ruff Format Details"
          ruff format --check --diff . || (echo "::error::Ruff formatting check failed! Run 'ruff format .' to fix." && exit 1)
          echo "::endgroup::"

      - name: Check Python lint
        run: |
          echo "::group::Ruff Lint Details"
          ruff check --output-format=github . || (echo "::error::Ruff lint check failed! Run 'ruff check . --fix' to fix." && exit 1)
          echo "::endgroup::"

      - name: Compile Python sources
        run: |
          echo "::group::Bytecode Compilation Details"
          python -m compileall -e app/ -e cli/ -e tests/ -q . || (echo "::error::Python compilation failed due to syntax errors!" && exit 1)
          echo "::endgroup::"

      - name: Run unit tests
        run: |
          echo "::group::Pytest Details"
          pytest tests/ -k "not integration and not live" --tb=short || (echo "::error::Unit tests failed!" && exit 1)
          echo "::endgroup::"
