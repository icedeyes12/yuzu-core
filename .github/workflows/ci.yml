name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt ruff

      - name: Install root frontend tooling
        run: npm ci

      - name: Check Python formatting
        run: ruff format --check .

      - name: Check Python lint
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Check legacy JavaScript syntax
        run: find static -type f -name '*.js' -exec node --check {} +

      - name: Check frontend JavaScript syntax
        working-directory: web
        run: find src -type f -name '*.js' -exec node --check {} +

      - name: Check frontend with Biome
        run: bunx @biomejs/biome check static/ web/src/
