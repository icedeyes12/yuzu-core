name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff pytest pytest-asyncio

      - name: Check Python formatting
        run: ruff format --check .

      - name: Check Python lint
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run unit tests
        run: pytest tests/ -k "not integration and not live" -q
