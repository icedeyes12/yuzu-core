<!-- FILE: templates/chat.html -->
<!-- DESCRIPTION: Chat interface for AI companion system -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="user-id" content="{{ user_id }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chat with your AI companion, {{ profile.partner_name }}.">
  <title>Chat | Yuzu Companion</title>

  <!-- CSS Imports -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/chat.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/marked.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/sidebar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/components/visual-language.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/components/tool-cards.css') }}">

  <!-- Highlight.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/tomorrow-night-blue.min.css">

  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  {% include 'sidebar.html' %}

  <div class="page-layout chat-layout">
    <header class="chat-header header-content" role="banner">
      <button
        class="hamburger-menu hamburger"
        id="hamburgerMenu"
        onclick="toggleSidebar()"
        aria-expanded="false"
        aria-controls="mainSidebar"
        type="button"
        aria-label="Open conversations and settings">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>

      <div class="header-left header-title">
        <h1 class="partner-name" id="partnerName">{{ profile.partner_name }}</h1>
        <div class="session-name" id="sessionName" aria-live="polite"></div>
      </div>

      <div class="affection-display" data-affection-level="{{ profile.affection }}" aria-label="Affection level: {{ profile.affection }}%">
        <span class="affection-icon" aria-hidden="true"></span>
        <span class="affection-value" aria-hidden="true">{{ profile.affection }}%</span>
      </div>
    </header>

    <main class="chat-container" id="chatContainer" aria-label="Chat messages" aria-live="polite">
      <!-- Messages rendered here by chat.js -->
    </main>

    <button id="scrollToBottomBtn" class="scroll-to-bottom-btn hidden" aria-label="Scroll to latest message">
      <img src="{{ url_for('static', path='assets/icons/arrow-down.svg') }}" width="24" height="24" alt="" aria-hidden="true">
    </button>

    <form class="input-area" id="chatForm" onsubmit="return false;" aria-label="Send a message">
      <label for="messageInput" class="sr-only">Message input</label>
      <textarea
        id="messageInput"
        name="message"
        placeholder="Type your message..."
        rows="1"
        aria-label="Type your message"
        autocomplete="off"></textarea>
      <button id="sendButton" type="submit" aria-label="Send message" class="btn-icon">
        <img src="{{ url_for('static', path='assets/icons/send.svg') }}" width="20" height="20" alt="" aria-hidden="true">
      </button>
    </form>
  </div>

  <dialog id="html-preview-modal" aria-labelledby="preview-modal-title" aria-modal="true">
    <div class="html-modal-backdrop" onclick="window.closeHtmlModal?.()" aria-hidden="true"></div>
    <article class="html-modal-content" role="document">
      <header class="html-modal-header">
        <span class="html-modal-title" id="preview-modal-title">HTML Preview</span>
        <div class="html-modal-actions" role="toolbar" aria-label="Preview controls">
          <button class="html-modal-btn" onclick="window.togglePreviewTheme?.()" title="Toggle theme" id="theme-toggle-btn" aria-label="Toggle preview theme">
            <img src="{{ url_for('static', path='assets/icons/sun.svg') }}" width="16" height="16" alt="" aria-hidden="true">
          </button>
          <button class="html-modal-btn" onclick="window.togglePreviewFullscreen?.()" title="Toggle fullscreen" id="fullscreen-toggle-btn" aria-label="Toggle preview fullscreen">
            <img src="{{ url_for('static', path='assets/icons/maximize.svg') }}" width="16" height="16" alt="" aria-hidden="true">
          </button>
          <button class="html-modal-close" onclick="window.closeHtmlModal?.()" aria-label="Close preview">
            <img src="{{ url_for('static', path='assets/icons/x.svg') }}" width="18" height="18" alt="" aria-hidden="true">
          </button>
        </div>
      </header>
      <div class="html-modal-body" id="preview-body">
        <iframe id="preview-iframe" sandbox="allow-scripts allow-same-origin" title="HTML preview"></iframe>
        <aside id="console-panel" class="console-panel" aria-label="JavaScript console">
          <div class="console-header">
            <span>&#9881; Console</span>
            <button class="console-clear" onclick="window._clearConsole()" aria-label="Clear console output">Clear</button>
          </div>
          <div id="console-output" role="log" aria-live="polite"></div>
        </aside>
      </div>
    </article>
  </dialog>

  <!-- Load marked.js v18.0.2 for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.2/lib/marked.umd.js"></script>
  
  <!-- Load Mermaid.js v11.4.0 for diagram rendering -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.0/dist/mermaid.min.js"></script>

  <!-- Load Highlight.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/json.min.js"></script>

  <script src="{{ url_for('static', path='js/provider-registry.js') }}"></script>
<script src="{{ url_for('static', path='js/badge-registry.js') }}"></script>
<script src="{{ url_for('static', path='js/icon-registry.js') }}"></script>
<script src="{{ url_for('static', path='js/visual-registry.js') }}"></script>
  <script src="{{ url_for('static', path='js/sidebar.js') }}"></script>
  <script type="module" src="{{ url_for('static', path='js/chat.js') }}"></script>
</body>
</html>
