<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Yuzu Companion — your AI companion app.">
  <title>Login | Yuzu Companion</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
</head>
<body class="login-body" data-theme="stellar-night-suisei">
  <main class="login-page page-frame" aria-label="Sign in">
    <div class="login-container" role="region" aria-labelledby="login-heading">
      <h1 class="login-title" id="login-heading">Yuzu Companion</h1>
      <p class="login-subtitle">Sign in to continue</p>

      <div class="login-buttons" role="group" aria-label="Sign-in options">
        <a href="/api/auth/login?provider=google"
           class="login-btn btn-google"
           aria-label="Sign in with Google">
          <img src="{{ url_for('static', path='assets/logos/providers/google.svg') }}" width="20" height="20" alt="" aria-hidden="true">
          Sign in with Google
        </a>
        <a href="/api/auth/login?provider=github"
           class="login-btn btn-github"
           aria-label="Sign in with GitHub">
          <img src="{{ url_for('static', path='assets/logos/providers/github.svg') }}" width="20" height="20" alt="" aria-hidden="true">
          Sign in with GitHub
        </a>
      </div>
    </div>
  </main>
</body>
</html>
