<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Yuzu Companion — your AI companion app.">
  <title>Login | Yuzu Companion</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
</head>
<body class="login-body" data-theme="stellar-night-suisei">
  <main class="login-page" aria-label="Sign in">
    <div class="decorative-blob"></div>
    <div class="decorative-blob blob-2"></div>
    <div class="login-container glass-panel" role="region" aria-labelledby="login-heading">
      <h1 class="login-title" id="login-heading">Yuzu Companion</h1>
      <p class="login-subtitle">Sign in to continue</p>

      <div class="login-buttons" role="group" aria-label="Sign-in options">
        <a href="/api/auth/login?provider=google"
           class="login-btn btn-google"
           aria-label="Sign in with Google">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M12.48 10.12v3.04h4.39c-.19 1.15-1.34 3.37-4.39 3.37-2.64 0-4.8-2.19-4.8-4.89s2.16-4.89 4.8-4.89c1.51 0 2.52.64 3.1 1.2l2.11-2.04C16.04 4.43 14.48 3.76 12.48 3.76c-3.87 0-7 3.13-7 7s3.13 7 7 7c4.05 0 6.73-2.85 6.73-6.86 0-.46-.05-.81-.11-1.16l-6.62-.12z"/>
          </svg>
          Sign in with Google
        </a>
        <a href="/api/auth/login?provider=github"
           class="login-btn btn-github"
           aria-label="Sign in with GitHub">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.565 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          Sign in with GitHub
        </a>
      </div>
    </div>
  </main>
</body>
</html>
